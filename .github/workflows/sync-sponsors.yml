name: Sync Patreon sponsors

# Runs daily and on demand. Updates sponsors.json, which the app's Sponsors page reads.
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sponsors from Patreon
        env:
          PATREON_ACCESS_TOKEN: ${{ secrets.PATREON_ACCESS_TOKEN }}
        run: python .github/scripts/sync_patreon_sponsors.py

      - name: Commit changes
        run: |
          if git diff --quiet -- sponsors.json; then
            echo "No sponsor changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sponsors.json
          git commit -m "chore: update sponsors"
          git push
