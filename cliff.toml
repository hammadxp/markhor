# git-cliff config: turns Conventional Commits into one CHANGELOG.md section per release.
# The Release workflow runs `git-cliff --unreleased --tag vX.Y.Z` and inserts the output below
# the <!-- next-release --> marker, so header and footer stay empty here.
# Docs: https://git-cliff.org/docs/configuration

[changelog]
header = ""
# INFO: Group names start with an HTML comment only to control their order; striptags removes it.
body = """
## [{{ version }}](https://github.com/hammadxp/markhor/releases/tag/{{ version }}) - {{ now() | date(format="%Y-%m-%d") }}
{% if commits | length == 0 %}
No user-facing changes.
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
# Commits that match no parser below are left out.
filter_commits = true
tag_pattern = "v[0-9].*"
sort_commits = "newest"

commit_parsers = [
  { message = "^chore\\(release\\)", skip = true },
  { field = "breaking", pattern = "true", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Added" },
  { message = "^fix", group = "<!-- 2 -->Fixed" },
  { message = "^(perf|refactor|style)", group = "<!-- 3 -->Changed" },
  { message = "^revert", group = "<!-- 4 -->Removed" },
  { message = "^(docs|chore|ci|build|test)", skip = true },
]
